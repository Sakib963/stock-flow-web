<!-- Page Header with breadcrumbs, title, actions, and filters -->
<page-header [title]="'Aisle List'" [description]="'View and manage all aisles in your warehouses'" [pageKey]="'configuration.aisle.list'" [showBackButton]="false" [extraTemplate]="headerActions" [contentTemplate]="headerFilters"> </page-header>

<!-- Template for header actions (buttons) -->
<ng-template #headerActions>
    <nz-space>
        <button nz-button nzType="primary" (click)="handleListActions({ action: 'create', value: null })">
            <nz-icon nzType="plus"></nz-icon>
            Add Aisle
        </button>
    </nz-space>
</ng-template>

<!-- Template for header content (filters, search) -->
<ng-template #headerFilters>
    <nz-divider class="mt-0 mb-4"></nz-divider>
    <nz-input-wrapper class="w-full md:w-96">
            <span nzInputPrefix nz-icon nzType="search"></span>
        <input type="text" nz-input placeholder="Search aisles..." [formControl]="searchControl" />
    </nz-input-wrapper>

</ng-template>

<!-- Page Loading State -->
@if (pageLoading) {
    <div class="flex justify-center items-center py-20">
        <app-loader [isVisible]="true"></app-loader>
    </div>
} @else {
    <nz-divider class="my-0"></nz-divider>
    <div class="p-4">
        <!-- Adaptive List Component to display aisles -->
        <adaptive-list [dataSource]="data" [tableConfig]="aisleTableConfig" [loading]="tableLoading" [totalCount]="totalCount" [pageSize]="payload.limit" [pageIndex]="payload.offset / payload.limit" (actionEvent)="handleListActions($event)" (paginationChange)="handlePaginationEvent($event)"> </adaptive-list>
    </div>
}
