<!-- Page Header with breadcrumbs, title, actions, and filters -->
<page-header [title]="'Register New Product'"
      [description]="'Register a new product to your inventory'"
      [pageKey]="'configuration.product.create'" [showBackButton]="false" [extraTemplate]="headerActions">
</page-header>

<!-- Template for header actions (buttons) -->
<ng-template #headerActions>
      <button nz-button nzType="default" (click)="goBack()">
            <nz-icon nzType="left" nzTheme="outline" />
            Back
      </button>
</ng-template>

<!-- Content Section -->
<nz-divider class="my-0"></nz-divider>
<product-form [buttonLoading]="buttonLoading()" (actions)="onFormActions($event)"></product-form>
