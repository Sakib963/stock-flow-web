<!-- Page Header with breadcrumbs, title, actions, and filters -->
<page-header [title]="'Add New Supplier'"
      [description]="'Register a new supplier with contact and business information'"
      [pageKey]="'configuration.supplier.create'" [showBackButton]="false" [extraTemplate]="headerActions">
</page-header>

<!-- Template for header actions (buttons) -->
<ng-template #headerActions>
      <button nz-button nzType="default" (click)="goBack()">
            <nz-icon nzType="left" nzTheme="outline" />
            Back
      </button>
</ng-template>

<!-- Content Section -->
<nz-divider class="my-0"></nz-divider>
<supplier-form [buttonLoading]="buttonLoading()" (actions)="onFormActions($event)"></supplier-form>
