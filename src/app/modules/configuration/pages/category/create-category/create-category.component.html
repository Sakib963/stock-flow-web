<!-- Page Header with breadcrumbs, title, actions, and filters -->
<page-header [title]="'Create Product Category'"
      [description]="'Create a new category to organize and group related products'"
      [pageKey]="'configuration.category.create'" [showBackButton]="false" [extraTemplate]="headerActions">
</page-header>

<!-- Template for header actions (buttons) -->
<ng-template #headerActions>
      <button nz-button nzType="default" (click)="goBack()">
            <nz-icon nzType="left" nzTheme="outline" />
            Back
      </button>
</ng-template>

<!-- Content Section -->
<nz-divider class="my-0"></nz-divider>
<category-form [buttonLoading]="buttonLoading()" (actions)="onFormActions($event)"></category-form>
