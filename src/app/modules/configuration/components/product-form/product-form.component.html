<div class="p-4">
      <form nz-form [formGroup]="form" [nzLayout]="'vertical'" (ngSubmit)="onSubmit()">
            <div class="grid grid-cols-1 md:gap-x-6 md:grid-cols-2 lg:grid-cols-3">
                  <!-- Product Name -->
                  <nz-form-item>
                        <nz-form-label [nzRequired]="hasRequiredValidator('name')">Product Name</nz-form-label>
                        <nz-form-control nzErrorTip="Product name is required.">
                              <input formControlName="name" nz-input placeholder="Enter Product Name" />
                        </nz-form-control>
                  </nz-form-item>

                  <!-- SKU -->
                  <nz-form-item>
                        <nz-form-label [nzRequired]="hasRequiredValidator('sku')">SKU</nz-form-label>
                        <nz-form-control nzErrorTip="SKU is required.">
                              <input formControlName="sku" nz-input placeholder="Enter SKU" />
                        </nz-form-control>
                  </nz-form-item>

                  <!-- Sub Category -->
                  <nz-form-item>
                        <nz-form-label [nzRequired]="hasRequiredValidator('sub_category_oid')">Category</nz-form-label>
                        <nz-form-control nzErrorTip="category is required.">
                              <nz-select class="w-full" formControlName="sub_category_oid" nz-input nzAllowClear nzShowSearch
                                    nzPlaceHolder="Select Category" [nzLoading]="loadingStates().subCategory" [nzOptions]="subCategoryList">
                              </nz-select>
                        </nz-form-control>
                  </nz-form-item>

                  <!-- Brand -->
                  <nz-form-item>
                        <nz-form-label [nzRequired]="hasRequiredValidator('brand_oid')">Brand</nz-form-label>
                        <nz-form-control nzErrorTip="Brand is required.">
                              <nz-select class="w-full" formControlName="brand_oid" nz-input nzAllowClear nzShowSearch
                                    nzPlaceHolder="Select Brand" [nzLoading]="loadingStates().brand">
                                    <nz-option *ngFor="let brand of brandList" [nzLabel]="brand.label"
                                          [nzValue]="brand.value"></nz-option>
                              </nz-select>
                        </nz-form-control>
                  </nz-form-item>

                  <!-- Unit Type -->
                  <nz-form-item>
                        <nz-form-label [nzRequired]="hasRequiredValidator('unit_type')">Unit Type</nz-form-label>
                        <nz-form-control nzErrorTip="Unit type is required.">
                              <nz-select class="w-full" formControlName="unit_type" nz-input nzAllowClear nzShowSearch
                                    nzPlaceHolder="Select Unit Type">
                                    <nz-option *ngFor="let unit of unitTypeList" [nzLabel]="unit.label"
                                          [nzValue]="unit.value"></nz-option>
                              </nz-select>
                        </nz-form-control>
                  </nz-form-item>

                  <!-- Product Nature -->
                  <nz-form-item>
                        <nz-form-label [nzRequired]="hasRequiredValidator('product_nature')">Product Nature</nz-form-label>
                        <nz-form-control nzErrorTip="Product nature is required.">
                              <nz-select class="w-full" formControlName="product_nature" nz-input nzAllowClear nzShowSearch
                                    nzPlaceHolder="Select Product Nature">
                                    <nz-option *ngFor="let nature of productNatureList" [nzLabel]="nature.label"
                                          [nzValue]="nature.value"></nz-option>
                              </nz-select>
                        </nz-form-control>
                  </nz-form-item>

                  <!-- Restock Threshold -->
                  <nz-form-item>
                        <nz-form-label [nzRequired]="hasRequiredValidator('restock_threshold')">Restock Threshold</nz-form-label>
                        <nz-form-control nzErrorTip="Restock threshold is required.">
                              <nz-input-number class="w-full" formControlName="restock_threshold" [nzMin]="0"
                                    [nzStep]="1" nzPlaceHolder="Enter Threshold"></nz-input-number>
                        </nz-form-control>
                  </nz-form-item>

                  <!-- Status -->
                  <nz-form-item>
                        <nz-form-label [nzRequired]="hasRequiredValidator('status')">Status</nz-form-label>
                        <nz-form-control nzErrorTip="Status is required.">
                              <nz-select class="w-full" formControlName="status" nz-input nzAllowClear nzShowSearch
                                    nzPlaceHolder="Select Status">
                                    <nz-option nzLabel="Active" nzValue="Active"></nz-option>
                                    <nz-option nzLabel="Inactive" nzValue="Inactive"></nz-option>
                              </nz-select>
                        </nz-form-control>
                  </nz-form-item>

                  <nz-divider class="md:col-span-2 lg:col-span-3"></nz-divider>
                  <!-- Product Photo -->
                  <nz-form-item>
                        <nz-form-label>Product Photo</nz-form-label>
                        <nz-form-control>
                              <div *ngIf="!form.controls['photo'].value"
                                    class="flex flex-col items-center justify-center h-32 border border-dashed rounded cursor-pointer hover:border-blue-500 transition-colors"
                                    (click)="fileInput.click()">
                                    <nz-spin *ngIf="imgLoading" nzSimple></nz-spin>
                                    <div *ngIf="!imgLoading" class="text-center">
                                          <nz-icon nzType="cloud-upload" class="text-2xl text-gray-400"></nz-icon>
                                          <p class="text-xs text-gray-500 mt-1">Click to upload (Max 500KB)</p>
                                    </div>
                              </div>
                              <div *ngIf="form.controls['photo'].value" class="relative group">
                                    <div class="relative w-full h-32 overflow-hidden rounded border cursor-pointer transition-all duration-300 group-hover:border-blue-400 group-hover:shadow-lg"
                                         (click)="previewPhoto(form.controls['photo'].value)">
                                          <img class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110"
                                                [src]="form.controls['photo'].value" alt="Product Photo">
                                          <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition-all duration-300 flex items-center justify-center">
                                                <nz-icon nzType="eye" nzTheme="outline" 
                                                      class="text-white text-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></nz-icon>
                                          </div>
                                    </div>
                                    <button nz-button nzSize="small" nzType="text" nzDanger type="button" 
                                          class="absolute top-1 right-1 z-10 bg-white bg-opacity-90 hover:bg-opacity-100 transition-all" 
                                          (click)="removePhoto()">
                                          <nz-icon nzType="delete"></nz-icon>
                                    </button>
                              </div>
                              <input type="file" accept=".png,.jpg,.jpeg,.gif" #fileInput class="hidden"
                                    (change)="onFileSelected($event)" />
                        </nz-form-control>
                  </nz-form-item>

                  <!-- Description -->
                  <nz-form-item class="md:col-span-2">
                        <nz-form-label [nzRequired]="hasRequiredValidator('description')">Description</nz-form-label>
                        <nz-form-control nzErrorTip="Description is required.">
                              <textarea formControlName="description" rows="2" nz-input placeholder="Enter Description"
                                    nzAutosize></textarea>
                        </nz-form-control>
                  </nz-form-item>
            </div>
            <nz-divider class="my-0"></nz-divider>
            <div class="mt-4 flex justify-end items-center">
                  <div class="flex items-center gap-4">
                        @let isEditMode = mode() === 'edit';
                        @if (!isEditMode) {
                        <button nz-button type="button" nzType="default" (click)="resetForm()">
                              <nz-icon nzType="undo" nzTheme="outline" />
                              Reset</button>
                        } @else {
                        <button nz-button type="button" nzType="default" (click)="onCancel()">
                              <nz-icon nzType="undo" nzTheme="outline" />
                              Cancel</button>
                        }
                        <button nz-button type="submit" nzType="primary" [nzLoading]="buttonLoading()">
                              <nz-icon nzType="save" nzTheme="outline" />
                              Submit</button>
                  </div>
            </div>
      </form>
</div>
