<!-- Page Header with breadcrumbs, title, actions, and filters -->
<page-header [title]="'Pre-Orders'" [description]="'Customer bookings for stock you do not hold yet. Not orders, and not counted as sales.'" [pageKey]="'sales.pre-order.list'" [showBackButton]="false" [extraTemplate]="headerActions" [contentTemplate]="headerFilters"> </page-header>

<!-- Template for header actions (buttons) -->
<ng-template #headerActions>
    <nz-space>
        <button nz-button nzType="primary" (click)="handleListActions({ action: 'create', value: null })">
            <nz-icon nzType="plus"></nz-icon>
            New Pre-Order
        </button>
    </nz-space>
</ng-template>

<!-- Template for header content (filters, search) -->
<ng-template #headerFilters>
    <nz-divider class="mt-0 mb-4"></nz-divider>
    <div class="flex flex-wrap items-center gap-3">
        <nz-input-wrapper class="w-full md:w-96">
            <span nzInputPrefix nz-icon nzType="search"></span>
            <input type="text" nz-input placeholder="Search pre-orders..." [formControl]="searchControl" />
        </nz-input-wrapper>
        <nz-select class="w-full md:w-48" nzAllowClear nzPlaceHolder="All statuses" (ngModelChange)="onStatusChange($event)" [ngModel]="payload.status || null">
            @for (status of statusOptions; track status) {
                <nz-option [nzValue]="status" [nzLabel]="status"></nz-option>
            }
        </nz-select>
    </div>
</ng-template>

<!-- Page Loading State -->
@if (pageLoading) {
    <div class="flex justify-center items-center py-20">
        <app-loader [isVisible]="true"></app-loader>
    </div>
} @else {
    <nz-divider class="my-0"></nz-divider>

    <!-- KPI strip: what the pre-order book is worth and what needs attention -->
    @if (kpis(); as kpi) {
        <div class="px-4 pt-4">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="border rounded-sm bg-white p-4 text-center">
                    <nz-statistic [nzValue]="kpi.openCount" [nzTitle]="'Open Pre-Orders'" [nzPrefix]="prefixOpen"></nz-statistic>
                    <ng-template #prefixOpen>
                        <span nz-icon nzType="clock-circle" nzTheme="outline"></span>
                    </ng-template>
                </div>
                <div class="border rounded-sm bg-white p-4 text-center">
                    <nz-statistic [nzValue]="kpi.advanceHeld" [nzTitle]="'Advance Held (liability)'" [nzPrefix]="prefixMoney"></nz-statistic>
                    <ng-template #prefixMoney>
                        <span nz-icon nzType="dollar" nzTheme="outline"></span>
                    </ng-template>
                </div>
                <div class="border rounded-sm bg-white p-4 text-center">
                    <nz-statistic [nzValue]="kpi.readyToConvert" [nzTitle]="'Ready To Convert'" [nzValueStyle]="{ color: '#109648' }" [nzPrefix]="prefixReady"></nz-statistic>
                    <ng-template #prefixReady>
                        <span nz-icon nzType="check-circle" nzTheme="outline"></span>
                    </ng-template>
                </div>
                <div class="border rounded-sm bg-white p-4 text-center">
                    <nz-statistic [nzValue]="kpi.overdueCount" [nzTitle]="'Overdue'" [nzValueStyle]="{ color: kpi.overdueCount > 0 ? '#DF2935' : undefined }" [nzPrefix]="prefixOverdue"></nz-statistic>
                    <ng-template #prefixOverdue>
                        <span nz-icon nzType="warning" nzTheme="outline"></span>
                    </ng-template>
                </div>
            </div>
        </div>
    }

    <div class="p-4">
        <!-- Adaptive List Component to display pre-orders -->
        <adaptive-list [dataSource]="data" [tableConfig]="preOrderTableConfig" [loading]="tableLoading" [totalCount]="totalCount" [pageSize]="payload.limit" [pageIndex]="payload.offset / payload.limit" (actionEvent)="handleListActions($event)" (paginationChange)="handlePaginationEvent($event)"> </adaptive-list>
    </div>
}
