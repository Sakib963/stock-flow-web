<!-- Page Header with breadcrumbs, title, actions, and filters -->
<page-header [title]="'New Pre-Order'" [description]="'Book a product for a customer before it is in stock. No stock is held and nothing is counted as a sale.'" [pageKey]="'sales.pre-order.create'" [showBackButton]="false" [extraTemplate]="headerActions"> </page-header>

<!-- Template for header actions (buttons) -->
<ng-template #headerActions>
    <button nz-button nzType="default" (click)="goBack()">
        <nz-icon nzType="left" nzTheme="outline" />
        Back
    </button>
</ng-template>

<!-- Content Section -->
<nz-divider class="my-0"></nz-divider>
<pre-order-form [buttonLoading]="buttonLoading()" (actions)="onFormActions($event)"></pre-order-form>
