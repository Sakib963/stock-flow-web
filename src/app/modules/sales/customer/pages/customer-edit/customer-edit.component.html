<page-header [back]="back" [title]="'sales.customer.editTitle' | translate" [lead]="'sales.customer.formLead' | translate" />

@if (customer(); as record) {
    <form-page [formId]="editor()?.formId ?? ''" [saving]="saving()" [remaining]="editor()?.remaining() ?? 0" saveLabel="form.saveChanges" (cancel)="cancel()">
        <customer-form [editing]="record" (submitted)="save()" />
    </form-page>
} @else if (loading()) {
    <!-- Shaped like the form that is coming, so the page does not jump when it lands. -->
    <div class="grid w-full grid-cols-1 gap-x-4 gap-y-6 rounded-container border border-line bg-white px-4 py-4 md:grid-cols-3 md:px-5 md:py-5" role="status" [attr.aria-label]="'form.loading' | translate">
        @for (field of [1, 2, 3, 4, 5, 6]; track field) {
            <nz-skeleton nzActive [nzTitle]="{ width: '40%' }" [nzParagraph]="{ rows: 1, width: '100%' }" />
        }
    </div>
} @else if (failed(); as failure) {
    <div class="sf-empty" role="alert">
        <p class="m-0 text-sm text-ink-body">{{ 'sales.customer.loadFailed.' + failure | translate }}</p>
        <div class="mt-3 flex items-center justify-center gap-2">
            <button nz-button nzType="default" type="button" class="inline-flex items-center gap-1.5" (click)="backToList()">
                <ng-icon name="lucideArrowLeft" size="14px" aria-hidden="true" />
                <span>{{ 'sales.customer.backToList' | translate }}</span>
            </button>
            <button nz-button nzType="primary" type="button" class="inline-flex items-center gap-1.5" (click)="load()">
                <ng-icon name="lucideRotateCw" size="14px" aria-hidden="true" />
                <span>{{ 'form.retry' | translate }}</span>
            </button>
        </div>
    </div>
}
