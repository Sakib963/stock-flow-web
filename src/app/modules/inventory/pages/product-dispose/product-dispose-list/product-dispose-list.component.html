<!-- Page Header with breadcrumbs, title, actions, and filters -->
<page-header [title]="'Product Dispose List'" [description]="'View and manage all stock disposals in your system'" [pageKey]="'inventory.product-dispose.list'" [showBackButton]="false" [extraTemplate]="headerActions" [contentTemplate]="headerFilters"> </page-header>

<!-- Template for header actions (buttons) -->
<ng-template #headerActions>
    <nz-space>
        <button nz-button nzType="primary" (click)="handleListActions({ action: 'create', value: null })">
            <nz-icon nzType="plus"></nz-icon>
            Add Disposal
        </button>
    </nz-space>
</ng-template>

<!-- Template for header content (filters, search) -->
<ng-template #headerFilters>
    <nz-divider class="mt-0 mb-4"></nz-divider>
    <nz-select class="mb-4 md:mb-0 mr-4 w-full md:w-60" nzAllowClear nzPlaceHolder="Filter by Status" [formControl]="statusControl">
        <nz-option *ngFor="let status of statusList" [nzLabel]="status.label" [nzValue]="status.value"> </nz-option>
    </nz-select>
    <nz-input-wrapper class="w-full md:w-96">
            <span nzInputPrefix nz-icon nzType="search"></span>
        <input type="text" nz-input placeholder="Search by dispose no or product..." [formControl]="searchControl" />
    </nz-input-wrapper>
</ng-template>

<!-- Page Loading State -->
@if (pageLoading) {
    <div class="flex justify-center items-center py-20">
        <app-loader [isVisible]="true"></app-loader>
    </div>
} @else {
    <nz-divider class="my-0"></nz-divider>
    <div class="p-4">
        <adaptive-list [dataSource]="data" [tableConfig]="disposeTableConfig" [loading]="tableLoading" [totalCount]="totalCount" [pageSize]="payload.limit" [pageIndex]="payload.offset / payload.limit" (actionEvent)="handleListActions($event)" (paginationChange)="handlePaginationEvent($event)"> </adaptive-list>
    </div>
}
