<div class="rounded-md bg-white max-w-full w-full">
    <form nz-form [formGroup]="form" [nzLayout]="'vertical'" (ngSubmit)="handleSubmit()" class="space-y-4">
        <div class="border-[0.5px] p-4 rounded-sm">
            <h2 class="text-xl font-medium mb-4">Update Pricing — {{ modalData.batch_code }}</h2>
            <nz-alert nzType="info" nzShowIcon class="mb-4" [nzMessage]="null" [innerHTML]="getPerUnitPriceText()"> </nz-alert>

            <div class="grid grid-cols-1 gap-4">
                <nz-form-item>
                    <nz-form-label [nzRequired]="hasRequiredValidator('selling_price')">
                        Selling Price
                        <nz-icon nzType="question-circle" nzTheme="outline" class="ml-1 text-gray-400" nz-tooltip [nzTooltipTitle]="getTooltipText('selling_price')"></nz-icon>
                    </nz-form-label>
                    <nz-form-control nzErrorTip="Selling Price is required." [nzValidateStatus]="form.get('selling_price') || ''" [nzHasFeedback]="true">
                        <input formControlName="selling_price" type="number" nz-input placeholder="Enter Selling Price" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label [nzRequired]="hasRequiredValidator('maximum_discount')">
                        Maximum Discount (BDT)
                        <nz-icon nzType="question-circle" nzTheme="outline" class="ml-1 text-gray-400" nz-tooltip [nzTooltipTitle]="getTooltipText('maximum_discount')"></nz-icon>
                    </nz-form-label>
                    <nz-form-control nzErrorTip="Maximum Discount is required." [nzValidateStatus]="form.get('maximum_discount') || ''" [nzHasFeedback]="true">
                        <input nz-input type="number" formControlName="maximum_discount" placeholder="Max Discount in BDT" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label>Ad Run Cost <nz-icon nzType="question-circle" nzTheme="outline" class="ml-1 text-gray-400" nz-tooltip [nzTooltipTitle]="getTooltipText('ad_run_cost')"></nz-icon></nz-form-label>
                    <nz-form-control [nzValidateStatus]="form.get('ad_run_cost') || ''" [nzHasFeedback]="true">
                        <input nz-input type="number" formControlName="ad_run_cost" placeholder="Ad run cost per unit" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label>Packaging Cost <nz-icon nzType="question-circle" nzTheme="outline" class="ml-1 text-gray-400" nz-tooltip [nzTooltipTitle]="getTooltipText('packaging_cost')"></nz-icon></nz-form-label>
                    <nz-form-control [nzValidateStatus]="form.get('packaging_cost') || ''" [nzHasFeedback]="true">
                        <input nz-input type="number" formControlName="packaging_cost" placeholder="Packaging cost per unit" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label>Gift Cost <nz-icon nzType="question-circle" nzTheme="outline" class="ml-1 text-gray-400" nz-tooltip [nzTooltipTitle]="getTooltipText('gift_cost')"></nz-icon></nz-form-label>
                    <nz-form-control [nzValidateStatus]="form.get('gift_cost') || ''" [nzHasFeedback]="true">
                        <input nz-input type="number" formControlName="gift_cost" placeholder="Gift cost per unit" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label>Content Creation Cost <nz-icon nzType="question-circle" nzTheme="outline" class="ml-1 text-gray-400" nz-tooltip [nzTooltipTitle]="getTooltipText('content_creation_cost')"></nz-icon></nz-form-label>
                    <nz-form-control [nzValidateStatus]="form.get('content_creation_cost') || ''" [nzHasFeedback]="true">
                        <input nz-input type="number" formControlName="content_creation_cost" placeholder="Content creation cost per unit" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label>Influencer Cost <nz-icon nzType="question-circle" nzTheme="outline" class="ml-1 text-gray-400" nz-tooltip [nzTooltipTitle]="getTooltipText('influencer_cost')"></nz-icon></nz-form-label>
                    <nz-form-control [nzValidateStatus]="form.get('influencer_cost') || ''" [nzHasFeedback]="true">
                        <input nz-input type="number" formControlName="influencer_cost" placeholder="Influencer cost per unit" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label>Cost Remarks <nz-icon nzType="question-circle" nzTheme="outline" class="ml-1 text-gray-400" nz-tooltip [nzTooltipTitle]="getTooltipText('cost_remarks')"></nz-icon></nz-form-label>
                    <nz-form-control [nzValidateStatus]="form.get('cost_remarks') || ''" [nzHasFeedback]="true">
                        <textarea nz-input formControlName="cost_remarks" [nzAutosize]="{ minRows: 2, maxRows: 4 }" placeholder="Add context notes for these costs"></textarea>
                    </nz-form-control>
                </nz-form-item>

                <nz-alert nzType="warning" [nzMessage]="getMaximumDiscountText()" nzShowIcon nzBorderless></nz-alert>

                <nz-alert
                    [nzType]="hasNegativeUnitProfit() ? 'error' : 'success'"
                    [nzMessage]="getUnitProfitHintText()"
                    nzShowIcon
                    nzBorderless
                ></nz-alert>
            </div>
        </div>

        <div class="flex justify-end gap-3">
            <button nz-button nzType="default" type="button" (click)="closeModal()">Cancel</button>
            <button nz-button nzType="primary" type="submit">Submit</button>
        </div>
    </form>
</div>
