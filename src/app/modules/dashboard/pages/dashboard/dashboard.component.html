<page-header [title]="'dashboard.title' | translate" [lead]="greeting()" />

<section class="grid gap-4 md:grid-cols-3">
    @for (tile of tiles(); track tile.key) {
        <article class="rounded-container border border-line bg-white p-5">
            <h2 class="text-ink-soft text-xs font-semibold uppercase tracking-wide">{{ tile.key | translate }}</h2>
            <p class="text-ink-faint mt-3 text-2xl font-bold">&mdash;</p>
            <p class="text-ink-soft mt-1 text-xs">{{ 'dashboard.noData' | translate }}</p>
        </article>
    }
</section>

<section class="mt-4 rounded-container border border-line bg-white p-5">
    <h2 class="text-ink text-sm font-bold">{{ 'dashboard.accessTitle' | translate }}</h2>
    <p class="text-ink-soft mt-1 text-xs">{{ 'dashboard.accessBody' | translate }}</p>
    <ul class="mt-3 flex flex-wrap gap-2">
        @for (section of sections(); track section) {
            <li class="rounded-control border border-line bg-surface-page px-2.5 py-1 text-xs font-semibold text-ink-muted">{{ section }}</li>
        }
    </ul>
</section>
