<header class="mb-2 flex flex-wrap items-start justify-between gap-x-6 gap-y-3 rounded-container border border-line bg-white px-4 py-3 md:mb-4 md:px-5 md:py-4" data-dashboard="welcome">
    <div class="flex min-w-0 flex-1 basis-80 items-start gap-3">
        <span class="flex size-10 flex-none items-center justify-center rounded-full bg-surface-sunken text-ink-soft">
            <ng-icon [name]="part().icon" size="20px" aria-hidden="true" />
        </span>
        <div class="min-w-0">
            <h1 class="m-0 text-[21px] leading-[1.3] font-extrabold tracking-[-0.015em] text-ink max-md:text-lg">{{ greeting() }}</h1>
            <p class="mt-0.5 mb-0 text-xs text-ink-muted" data-welcome="day">{{ day() }}</p>
            @if (summary(); as sentence) {
                <p class="mt-2 mb-0 max-w-2xl text-[13px] leading-normal text-ink-body" data-welcome="summary">{{ sentence }}</p>
            }
        </div>
    </div>

    <div class="flex-none max-md:w-full">
        <ng-content />
    </div>
</header>
