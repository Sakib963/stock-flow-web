<div class="p-4 space-y-3">
      <h2 class="text-2xl font-medium mb-4 animate-text">Product List</h2>
      <div>
            <div class="md:flex justify-between items-start mb-4 gap-4">
                  <!-- Left side: Category, Subcategory, Status, Search -->
                  <form [formGroup]="filterForm" class="md:w-3/4 grid lg:grid-cols-5 gap-4">
                        <!-- Category Dropdown -->
                        <nz-form-item>
                              <nz-form-control>
                                    <nz-select nz-input nzSize="large" [nzPlaceHolder]="'Select Category'" nzAllowClear
                                          nzShowSearch formControlName="category_oid">
                                          <nz-option *ngFor="let cat of categoryList" [nzLabel]="cat.label"
                                                [nzValue]="cat.value"></nz-option>
                                    </nz-select>
                              </nz-form-control>
                        </nz-form-item>

                        <!-- Subcategory Dropdown -->
                        <nz-form-item>
                              <nz-form-control>
                                    <nz-select nz-input nzSize="large" [nzPlaceHolder]="'Select Subcategory'"
                                          nzAllowClear nzShowSearch formControlName="sub_category_oid"
                                          [nzDisabled]="!filterForm.get('category_oid')?.value">
                                          <nz-option *ngFor="let sub of subCategoryList" [nzLabel]="sub.label"
                                                [nzValue]="sub.value"></nz-option>
                                    </nz-select>
                              </nz-form-control>
                        </nz-form-item>

                        <!-- Status Dropdown -->
                        <nz-form-item>
                              <nz-form-control>
                                    <nz-select [nzPlaceHolder]="'Select Status'" nz-input nzSize="large" nzAllowClear
                                          formControlName="status">
                                          <nz-option *ngFor="let s of statusList" [nzLabel]="s.label"
                                                [nzValue]="s.value"></nz-option>
                                    </nz-select>
                              </nz-form-control>
                        </nz-form-item>

                        <!-- Search Input -->
                        <nz-form-item>
                              <nz-form-control>
                                    <nz-input-group nzSize="large" nzSuffixIcon="search">
                                          <input nz-input type="text" formControlName="search_text"
                                                placeholder="Enter search text" />
                                    </nz-input-group>
                              </nz-form-control>
                        </nz-form-item>

                        <!-- Reset Button -->
                        <nz-form-item class="flex items-start">
                              <button nzDanger nz-button nzType="default" nzSize="large" (click)="resetFilters()"
                                    type="button">
                                    <i nz-icon nzType="redo"></i>
                                    Reset
                              </button>
                        </nz-form-item>
                  </form>
                  <!-- Right side: Add button -->
                  <div class="flex justify-end md:justify-center items-center gap-4 mt-4 md:mt-0">
                        <primary-button-with-plus-icon (click)="handleAdd()"
                              [label]="'Add Product'"></primary-button-with-plus-icon>
                  </div>
            </div>
            <app-view-product-list [loading]="loading" [data]="data" [totalCount]="totalCount"
                  [resetPaginationEvent]="resetChildPageEvent" (actionEmitter)="handleListActions($event)"
                  (paginationEvent)="handlePaginationEvent($event)"></app-view-product-list>
      </div>
</div>
