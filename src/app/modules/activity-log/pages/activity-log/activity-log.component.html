<page-header [breadcrumbs]="breadcrumbs" [title]="'Activity Log'" [description]="'Track all logged activities across the application'"> </page-header>

@if (pageLoading) {
    <div class="flex items-center justify-center py-20">
        <app-loader [isVisible]="true"></app-loader>
    </div>
} @else {
    <div class="space-y-4">
        <nz-card [nzBordered]="true">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <input nz-input placeholder="Search by title, description, performer" [formControl]="searchControl" />

                <nz-select [ngModel]="selectedFeature" (ngModelChange)="onFeatureChange($event)" nzPlaceHolder="Filter by feature" nzAllowClear>
                    @for (item of featureOptions; track item.value) {
                        <nz-option [nzLabel]="item.label" [nzValue]="item.value"></nz-option>
                    }
                </nz-select>

                <nz-range-picker [ngModel]="dateRange" (ngModelChange)="onDateRangeChange($event)"></nz-range-picker>

                <button nz-button nzType="default" (click)="refreshList()"><nz-icon nzType="reload"></nz-icon>Refresh</button>
            </div>
        </nz-card>

        <div class="p-4">
            <!-- Adaptive List Component to display activity logs -->
            <adaptive-list [dataSource]="data" [tableConfig]="activityLogTableConfig" [loading]="tableLoading" [totalCount]="totalCount" [pageSize]="payload.limit" [pageIndex]="payload.offset / payload.limit" (paginationChange)="handlePaginationEvent($event)"></adaptive-list>
        </div>
    </div>
}
