<nz-drawer [nzVisible]="open()" nzWidth="min(560px, 100vw)" nzPlacement="right" [nzTitle]="'administration.feature.treeTitle' | translate" [nzContent]="treeBody" [nzFooter]="treeFooter" (nzOnClose)="closed.emit()" />

<ng-template #treeBody>
    @if (failed(); as failure) {
        <div class="text-center" role="alert">
            <p class="m-0 text-sm text-ink-body">{{ 'administration.feature.loadFailed.' + failure | translate }}</p>
            <button nz-button nzType="primary" type="button" class="mt-3 inline-flex items-center gap-1.5" (click)="load()">
                <ng-icon name="lucideRotateCw" size="14px" aria-hidden="true" />
                <span>{{ 'form.retry' | translate }}</span>
            </button>
        </div>
    } @else if (data(); as loaded) {
        <p class="mt-0 mb-3 text-xs text-ink-soft">{{ 'administration.feature.treeNote' | translate }}</p>
        <grant-tree [tree]="loaded" maxHeight="none" data-registry="tree" />
    } @else {
        <span class="sr-only" role="status">{{ 'form.loading' | translate }}</span>
        <nz-skeleton nzActive [nzTitle]="false" [nzParagraph]="{ rows: 10 }" />
    }
</ng-template>

<ng-template #treeFooter>
    <div class="flex justify-end">
        <button nz-button nzType="default" type="button" class="inline-flex items-center gap-1.5" (click)="closed.emit()">
            <ng-icon name="lucideX" size="14px" aria-hidden="true" />
            <span>{{ 'administration.feature.closeTree' | translate }}</span>
        </button>
    </div>
</ng-template>
