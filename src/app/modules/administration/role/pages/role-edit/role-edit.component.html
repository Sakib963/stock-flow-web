<page-header [back]="back" [title]="'administration.role.editTitle' | translate" [lead]="'administration.role.formLead' | translate" />

@if (role(); as record) {
    @if (record.details.editable) {
        <form-page [formId]="editor()?.formId ?? ''" [saving]="roles.saving()" [framed]="false" saveLabel="form.saveChanges" (cancel)="cancel()">
            <role-form [editing]="record" (submitted)="save()" />
        </form-page>
    } @else {
        <div class="sf-empty" role="alert" data-role="locked">
            <p class="m-0 text-sm text-ink-body">{{ 'administration.role.lockedForYou' | translate: { name: record.details.name } }}</p>
            <div class="mt-3 flex items-center justify-center">
                <button nz-button nzType="default" type="button" class="inline-flex items-center gap-1.5" (click)="cancel()">
                    <ng-icon name="lucideArrowLeft" size="14px" aria-hidden="true" />
                    <span>{{ 'list.back' | translate }}</span>
                </button>
            </div>
        </div>
    }
} @else if (loading()) {
    <div class="flex flex-col gap-4 rounded-container border border-line bg-white px-4 py-4 md:px-5 md:py-5" role="status" [attr.aria-label]="'form.loading' | translate">
        <nz-skeleton nzActive [nzTitle]="{ width: '30%' }" [nzParagraph]="{ rows: 1, width: '100%' }" />
        <nz-skeleton nzActive [nzTitle]="{ width: '20%' }" [nzParagraph]="{ rows: 8, width: '100%' }" />
    </div>
} @else if (failed(); as failure) {
    <div class="sf-empty" role="alert">
        <p class="m-0 text-sm text-ink-body">{{ 'administration.role.loadFailed.' + failure | translate }}</p>
        <div class="mt-3 flex items-center justify-center gap-2">
            <button nz-button nzType="default" type="button" class="inline-flex items-center gap-1.5" (click)="backToList()">
                <ng-icon name="lucideArrowLeft" size="14px" aria-hidden="true" />
                <span>{{ 'administration.role.backToList' | translate }}</span>
            </button>
            <button nz-button nzType="primary" type="button" class="inline-flex items-center gap-1.5" (click)="load()">
                <ng-icon name="lucideRotateCw" size="14px" aria-hidden="true" />
                <span>{{ 'form.retry' | translate }}</span>
            </button>
        </div>
    </div>
}
