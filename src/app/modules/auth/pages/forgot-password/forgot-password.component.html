<auth-shell [clearCoreHeight]="300">
    <form class="sf-auth-card" [formGroup]="form" (ngSubmit)="handleSubmit()" novalidate>
        <a class="inline-flex w-fit cursor-pointer items-center gap-1.5 border-0 bg-none p-0 text-shell-title font-semibold text-primary no-underline hover:underline" routerLink="/auth/login">
            <ng-icon name="lucideArrowLeft" size="15px" />
            {{ 'auth.reset.backToSignIn' | translate }}
        </a>

        <div>
            <h2 class="m-0 text-2xl font-bold tracking-[-0.02em] text-n-900 max-md:text-[21px]">{{ 'auth.reset.requestTitle' | translate }}</h2>
            <p class="mt-0.75 mb-0 text-shell-title/normal text-n-500">
                <span class="max-md:hidden">{{ 'auth.reset.requestHint' | translate }}</span>
                <span class="hidden max-md:inline">{{ 'auth.reset.requestHintShort' | translate }}</span>
            </p>
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex flex-col gap-1.5">
                <label class="text-shell-title font-semibold text-n-800" for="recover-email">{{ 'auth.email' | translate }}</label>
                <nz-input-wrapper class="max-md:h-12 max-md:gap-2.5 max-md:px-3.5">
                    <ng-icon nzInputPrefix name="lucideMail" size="16px" class="text-n-400 max-md:text-base" />
                    <input #emailInput id="recover-email" nz-input nzSize="large" [nzStatus]="emailError() ? 'error' : ''" type="email" inputmode="email" autocomplete="username" formControlName="email" [placeholder]="'auth.emailPlaceholder' | translate" [attr.aria-invalid]="!!emailError()" [attr.aria-describedby]="emailError() ? 'recover-email-error' : null" (blur)="onEmailBlur()" />
                </nz-input-wrapper>
                <p class="sf-auth-message" id="recover-email-error">
                    @if (emailError(); as key) {
                        {{ key | translate }}
                    }
                </p>
            </div>

            <button nz-button nzType="primary" nzSize="large" nzBlock type="submit" class="mt-2.5 flex items-center justify-center gap-2 font-semibold transition-colors duration-200 ease-width max-md:h-12 max-md:text-[15px] max-md:font-bold" [nzLoading]="loading()">
                {{ 'auth.reset.sendCode' | translate }}
                @if (!loading()) {
                    <ng-icon name="lucideArrowRight" size="16px" />
                }
            </button>
        </div>

        <p class="m-0 border-t border-n-100 pt-4 text-xs/[1.6] text-n-600 max-md:mt-auto">{{ 'auth.reset.requestFoot' | translate }}</p>
    </form>
</auth-shell>
