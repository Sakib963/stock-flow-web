<auth-shell [clearCoreHeight]="300">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="handleSubmit()" novalidate>
        <a class="auth-back" routerLink="/auth/login">
            <ng-icon name="lucideArrowLeft" size="15px" />
            {{ 'auth.reset.backToSignIn' | translate }}
        </a>

        <div>
            <h2 class="auth-title">{{ 'auth.reset.requestTitle' | translate }}</h2>
            <p class="auth-hint">
                <span class="forgot__hint-long">{{ 'auth.reset.requestHint' | translate }}</span>
                <span class="forgot__hint-short">{{ 'auth.reset.requestHintShort' | translate }}</span>
            </p>
        </div>

        <div class="auth-fields">
            <div class="auth-field">
                <label class="auth-label" for="recover-email">{{ 'auth.email' | translate }}</label>
                <nz-input-wrapper>
                    <ng-icon nzInputPrefix name="lucideMail" size="16px" class="auth-field-icon" />
                    <input #emailInput id="recover-email" nz-input nzSize="large" [nzStatus]="emailError() ? 'error' : ''" type="email" inputmode="email" autocomplete="username" formControlName="email" [placeholder]="'auth.emailPlaceholder' | translate" [attr.aria-invalid]="!!emailError()" [attr.aria-describedby]="emailError() ? 'recover-email-error' : null" (blur)="onEmailBlur()" />
                </nz-input-wrapper>
                <p class="auth-message" id="recover-email-error">
                    @if (emailError(); as key) {
                        {{ key | translate }}
                    }
                </p>
            </div>

            <button nz-button nzType="primary" nzSize="large" nzBlock type="submit" class="auth-submit" [nzLoading]="loading()">
                {{ 'auth.reset.sendCode' | translate }}
                @if (!loading()) {
                    <ng-icon name="lucideArrowRight" size="16px" />
                }
            </button>
        </div>

        <p class="auth-foot">{{ 'auth.reset.requestFoot' | translate }}</p>
    </form>
</auth-shell>
