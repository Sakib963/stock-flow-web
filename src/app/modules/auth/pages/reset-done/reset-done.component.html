<auth-shell [clearCoreHeight]="300">
    <div class="sf-auth-card">
        <span class="flex size-11 items-center justify-center rounded-container border border-success-border bg-success-bg text-success" aria-hidden="true">
            <ng-icon name="lucideCircleCheck" size="22px" />
        </span>

        <div>
            <h2 class="m-0 text-2xl font-bold tracking-[-0.02em] text-ink max-md:text-[21px]">{{ 'auth.reset.doneTitle' | translate }}</h2>
            <p class="mt-0.75 mb-0 text-shell-title/normal text-ink-soft">
                {{ 'auth.reset.doneBody' | translate }} <span class="font-bold text-ink-body">{{ email() }}</span
                >{{ ' ' }}{{ 'auth.reset.doneBodyTail' | translate }}
            </p>
        </div>

        <a nz-button nzType="primary" nzSize="large" nzBlock class="mt-2.5 flex items-center justify-center gap-2 font-semibold transition-colors duration-200 ease-width max-md:h-12 max-md:text-[15px] max-md:font-bold" routerLink="/auth/login">
            {{ 'auth.reset.goToSignIn' | translate }}
            <ng-icon name="lucideArrowRight" size="16px" />
        </a>

        <p class="m-0 border-t border-line-soft pt-4 text-xs/[1.6] text-ink-muted max-md:mt-auto">{{ 'auth.reset.doneFoot' | translate }}</p>
    </div>
</auth-shell>
