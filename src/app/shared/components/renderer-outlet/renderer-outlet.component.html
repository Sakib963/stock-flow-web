@switch (status()) {
    @case ('ready') {
        <ng-container [ngComponentOutlet]="component()" [ngComponentOutletInputs]="accepted()" />
    }
    @case ('failed') {
        <div class="flex items-center gap-3 rounded-control border border-danger-border bg-danger-bg px-3 py-2 text-xs text-danger-ink" role="alert">
            <span class="flex-1">{{ 'list.rendererFailed' | translate }}</span>
            <button nz-button type="button" (click)="retry()">{{ 'list.retry' | translate }}</button>
        </div>
    }
}
