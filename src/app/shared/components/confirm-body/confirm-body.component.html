<p class="m-0">{{ copy.body }}</p>
<div class="mt-6 flex justify-end gap-2">
    <button nz-button nzType="default" type="button" class="inline-flex items-center gap-1.5" [disabled]="busy()" (click)="close(false)" data-confirm="cancel">
        <ng-icon name="lucideX" size="14px" aria-hidden="true" />
        <span>{{ copy.cancel }}</span>
    </button>
    <button nz-button nzType="primary" [nzDanger]="!!copy.danger" type="button" class="inline-flex items-center gap-1.5" [nzLoading]="busy()" cdkFocusInitial (click)="confirm()" data-confirm="ok">
        @if (!busy()) {
            <ng-icon [name]="copy.icon ?? 'lucideCheck'" size="14px" aria-hidden="true" />
        }
        <span>{{ copy.ok }}</span>
    </button>
</div>
