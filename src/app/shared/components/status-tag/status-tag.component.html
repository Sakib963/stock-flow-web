<nz-tag class="m-0 inline-flex items-center gap-1 rounded-sm border font-semibold leading-none whitespace-nowrap bn:leading-normal" [class]="classes()" [attr.data-tone]="tone()">
    @if (glyph(); as name) {
        <ng-icon [name]="name" [size]="glyphSize()" strokeWidth="2" aria-hidden="true" />
    }
    <span>{{ label() | text }}</span>
</nz-tag>
