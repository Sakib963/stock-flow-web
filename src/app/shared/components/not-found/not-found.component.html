<div class="bg-white rounded mt-4">
      <div class="p-6">
            <div class="flex flex-col items-center justify-center py-12 text-center">
                  <div class="rounded-full bg-yellow-100 p-3 mb-4">
                        <svg class="h-6 w-6 text-yellow-600" fill="none" height="24" stroke="currentColor"
                              stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"
                              width="24" xmlns="http://www.w3.org/2000/svg">
                              <circle cx="12" cy="12" r="10"></circle>
                              <line x1="12" x2="12" y1="8" y2="12"></line>
                              <line x1="12" x2="12.01" y1="16" y2="16"></line>
                        </svg>
                  </div>
                  <h3 class="text-lg font-medium tracking-tight mb-2">{{ title() }}</h3>
                  <p class="text-gray-500 mb-6 max-w-md">{{ subTitle() }}</p>
                  <div class="flex flex-wrap gap-4 justify-center">
                        <button nz-button (click)="onRefresh()">
                              <nz-icon nzTheme="outline" nzType="reload"></nz-icon>
                              Try Again
                        </button>
                        <button nz-button nzType="primary" [routerLink]="routeTo()">{{ redirectButtonLabel()
                              }}</button>
                  </div>
            </div>
      </div>
</div>
