<!-- z-70 keeps the bar above the drawers, so the trigger that opened one stays clickable. -->
<header class="relative z-70 flex h-14 flex-none items-center gap-2 border-b border-n-200 bg-white pr-2.5 md:gap-3 md:pr-4">
    <button type="button" class="sf-icon-btn ml-2 md:hidden" (click)="state.toggleMobile()" [attr.aria-expanded]="state.mobileOpen()" [attr.aria-label]="'shell.openMenu' | translate">
        <ng-icon name="lucideMenu" size="20px" />
    </button>

    <!-- Continues the sider column up through the header so the rail reads as one piece. The tint
         goes on a phone, where there is no column beneath it to continue. -->
    <div data-shell="brand" class="flex h-full flex-none items-center overflow-hidden max-md:w-auto max-md:gap-0 max-md:border-r-0 max-md:bg-transparent max-md:p-0 md:w-(--sider) md:border-r md:border-sider-border md:bg-sider-bg md:transition-[width] md:duration-180 md:ease-width" [class]="state.railCollapsed() ? 'md:justify-center md:gap-0 md:px-2' : 'md:gap-2.5 md:px-3.5'">
        <img class="size-6 flex-none" src="assets/icons/logo.svg" alt="" />
        @if (!state.isPhone() && !state.railCollapsed()) {
            <span class="truncate text-sm font-bold text-n-900" data-shell="business" nz-tooltip nzTooltipPlacement="bottom" [nzTooltipTitle]="session.business()?.name || ''">{{ session.business()?.name || 'StockFlow' }}</span>
        }
    </div>

    <button type="button" class="sf-icon-btn ml-1 max-md:hidden" (click)="state.toggleCollapsed()" [attr.aria-label]="state.collapsed() ? 'Expand menu' : 'Collapse menu'">
        <ng-icon [name]="state.collapsed() ? 'lucidePanelLeftOpen' : 'lucidePanelLeftClose'" size="18px" />
    </button>

    <!-- Not rendered at all on a phone rather than hidden: the sheet carries the field, and a
         hidden second copy would be the one the focus call found. -->
    @if (!state.isPhone()) {
        <search-panel variant="inline" />
    }

    <div class="ml-auto flex items-center gap-1.5">
        @if (state.isPhone()) {
            <button type="button" class="sf-icon-btn" (click)="state.openSearchPanel()" [attr.aria-label]="'shell.searchPlaceholder' | translate">
                <ng-icon name="lucideSearch" size="18px" />
            </button>
        }

        <!-- Disabled rather than hidden: the person should see where this lives before it arrives. -->
        <button type="button" class="sf-icon-btn max-md:hidden" disabled nz-tooltip nzTooltipPlacement="bottom" [nzTooltipTitle]="'shell.notesSoon' | translate">
            <ng-icon name="lucideStickyNote" size="18px" />
        </button>

        <button #bellTrigger type="button" class="sf-icon-btn" data-shell="bell" [class.is-open]="state.openPanel() === 'notifications'" [attr.aria-expanded]="state.openPanel() === 'notifications'" (click)="state.togglePanel('notifications')" nz-tooltip nzTooltipPlacement="bottom" [nzTooltipTitle]="'shell.notifications' | translate">
            <ng-icon name="lucideBell" size="18px" />
            <!-- Over the bell rather than beside it, so an unread alert never changes the width of
                 the header group. -->
            @if (notifications.hasUnread()) {
                <span class="absolute top-1.25 right-1.25 size-1.5 rounded-full bg-danger shadow-[0_0_0_1.5px_#fff]" data-shell="bell-dot"></span>
            }
        </button>

        <button #accountTrigger type="button" class="flex cursor-pointer items-center gap-1 rounded-control p-1 hover:bg-n-75" data-shell="account" [class.bg-n-75]="state.openPanel() === 'account'" [attr.aria-expanded]="state.openPanel() === 'account'" (click)="state.togglePanel('account')" nz-tooltip nzTooltipPlacement="bottomRight" [nzTooltipTitle]="session.user()?.name || ''">
            <nz-avatar [nzText]="session.initials()" [nzSize]="30" class="text-shell-hint font-bold" />
            <ng-icon name="lucideChevronDown" size="14px" class="text-n-400 transition-transform duration-200 ease-shell" [class.rotate-180]="state.openPanel() === 'account'" />
        </button>
    </div>
</header>
