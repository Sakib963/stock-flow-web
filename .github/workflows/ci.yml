name: CI

on:
    push:
        branches: [dev, 'feat/**', 'fix/**']
    pull_request:
        branches: [dev]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            # The real files are git-ignored; a build and the specs only need their shape. The local
            # environment.ts offers the guest visit, as on the laptop; a production build never does.
            - run: |
                  GUEST_ACCESS=true node tools/write-environment.mjs environment.ts
                  GUEST_ACCESS=false node tools/write-environment.mjs environment.production.ts
              env:
                  API_BASE_URL: https://api.invalid
                  TRACKER_URL: https://tracker.invalid
                  CLOUDINARY_CLOUD_NAME: ci
                  CLOUDINARY_UPLOAD_PRESET: ci

            - run: npm run verify

            - run: npx ng test --watch=false

            - run: npm audit --omit=dev --audit-level=high

    # Only a push to dev that passed the checks deploys. The values are this deployment's public
    # settings: everything in them ships in the bundle, so they are not secrets.
    deploy:
        needs: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.pages.outputs.page_url }}
        concurrency:
            group: deploy-pages
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - run: node tools/write-environment.mjs environment.ts environment.dev.ts
              env:
                  API_BASE_URL: https://stock-flow-server.vercel.app
                  TRACKER_URL: https://stock-flow-tracker-zeta.vercel.app
                  CLOUDINARY_CLOUD_NAME: stockflow
                  CLOUDINARY_UPLOAD_PRESET: stockflow
                  GUEST_ACCESS: 'true'

            - run: npx ng build --configuration=dev

            # Pages has no rewrites, so a deep link such as /stock-flow-web/app/dashboard is served the
            # app through the not-found page.
            - run: cp dist/stock-flow-web/browser/index.html dist/stock-flow-web/browser/404.html

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: dist/stock-flow-web/browser

            - id: pages
              uses: actions/deploy-pages@v4

            - name: The site answers
              run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null "${{ steps.pages.outputs.page_url }}"
